name: build

on:
  push:
    branches: [cloud-group]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: pnpm
        run: npm i -g pnpm@11

      - name: web-ui deps
        run: cd web-ui && pnpm install --frozen-lockfile --ignore-scripts && cd ..

      - name: android sdk
        run: |
          mkdir -p $HOME/Android/Sdk/cmdline-tools
          curl -sL -o /tmp/cli.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cli.zip -d $HOME/Android/Sdk/cmdline-tools
          mv $HOME/Android/Sdk/cmdline-tools/cmdline-tools $HOME/Android/Sdk/cmdline-tools/latest
          echo "sdk.dir=$HOME/Android/Sdk" > local.properties

      - name: sdk packages
        run: |
          yes | $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: build
        run: ./gradlew :app:assembleDebug --console=plain --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: orbis-apk
          path: app/build/outputs/apk/debug/*.apk
